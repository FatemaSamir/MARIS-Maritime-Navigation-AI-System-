# code-quality.yml — Maritime Navigation AI System
# Deep code quality checks: formatting, imports, and security scanning.
#
# Checks performed:
#   1. black — enforce consistent Python formatting
#   2. flake8 — PEP 8 style and basic error detection
#   3. Hardcoded credentials scan — grep for leaked passwords/tokens
#   4. Python import validation — catch broken imports early
#      (optional/heavy deps are skipped gracefully, not failed)

name: Code Quality

on:
  push:
    branches:
      - fatemabranch
      - main
  pull_request:
    branches:
      - fatemabranch
      - main

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Black format check
  # ──────────────────────────────────────────────────────────────────────────
  black:
    name: Black — Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install black
        run: pip install black

      - name: Check formatting
        run: |
          black --check --line-length=120 \
            src/ api/ mlops/ tests/ \
            --exclude='/(\.git|__pycache__|\.pyc|\.eggs)/'

  # ──────────────────────────────────────────────────────────────────────────
  # 2. flake8 style check
  # ──────────────────────────────────────────────────────────────────────────
  flake8:
    name: flake8 — Style Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 src/ api/ mlops/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,*.pyc,.git \
            --statistics \
            --count

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Hardcoded credentials scan
  # ──────────────────────────────────────────────────────────────────────────
  credentials-scan:
    name: Security — Hardcoded Credentials
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded passwords/tokens in application code
        run: |
          FAIL=0

          # Patterns that suggest real secrets outside of config/example files
          PATTERNS=(
            "password\s*=\s*['\"][^'\"]{8,}['\"]"
            "secret\s*=\s*['\"][^'\"]{8,}['\"]"
            "api_key\s*=\s*['\"][^'\"]{8,}['\"]"
            "token\s*=\s*['\"][^'\"]{8,}['\"]"
          )

          # Directories/files that legitimately contain placeholder credentials
          EXCLUDE_PATTERN="(\.example|example\.|test_|conftest|README|MIGRATION|ARCHITECTURE|SNOWFLAKE|CICD|docker-compose|mlflow_config|environment\.py|__pycache__)"

          for pat in "${PATTERNS[@]}"; do
            matches=$(grep -rniE "$pat" src/ api/ mlops/ \
              --include="*.py" \
              | grep -vE "$EXCLUDE_PATTERN" \
              | grep -vE "maritime123|maritime_password|your_password|changeme|placeholder|example|localhost" \
              || true)
            if [ -n "$matches" ]; then
              echo "WARN: Possible hardcoded credential found:"
              echo "$matches"
              # Non-fatal: warn but do not fail the job for this heuristic check
            fi
          done

          echo "Credential scan complete (warnings above are heuristic, not blocking)."

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Python import validation
  # ──────────────────────────────────────────────────────────────────────────
  import-check:
    name: Python — Import Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies only
        run: |
          pip install \
            fastapi sqlalchemy psycopg2-binary \
            pandas numpy pydantic \
            || true

      - name: Compile-check all Python files
        run: |
          ERRORS=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f" 2>/dev/null || {
              echo "SYNTAX ERROR: $f"
              ERRORS=$((ERRORS + 1))
            }
          done < <(find src/ api/ mlops/ tests/ -name "*.py" -print0)

          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS Python file(s) have syntax errors."
            exit 1
          fi
          echo "All Python files compile cleanly."

      - name: Validate core module imports
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/src/common:${{ github.workspace }}
        run: |
          # These imports must succeed; heavy ML deps gracefully skipped
          python -c "
          import sys

          def try_import(module, label):
              try:
                  __import__(module)
                  print(f'  OK  {label}')
              except ImportError as e:
                  # Tolerate missing optional/heavy packages
                  msg = str(e)
                  optional = ['mlflow', 'sklearn', 'xgboost', 'streamlit',
                              'pyspark', 'snowflake', 'plotly', 'folium',
                              'confluent_kafka', 'databricks']
                  if any(o in msg for o in optional):
                      print(f'  SKIP  {label}: optional dep missing ({e})')
                  else:
                      print(f'  FAIL  {label}: {e}')
                      sys.exit(1)

          try_import('common.config',    'src/common/config.py')
          try_import('api.main',         'api/main.py')
          print('Core imports validated.')
          "
