# docker-build.yml — Maritime Navigation AI System
# Validate Docker image build configurations on every push/PR.
#
# What this workflow does:
#   1. Validate docker-compose.yml syntax
#   2. Verify that referenced Dockerfiles exist
#   3. Build each image WITHOUT pushing to any registry
#
# No images are pushed — this is build validation only.

name: Docker Build Validation

on:
  push:
    branches:
      - fatemabranch
      - main
  pull_request:
    branches:
      - fatemabranch
      - main

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Validate Compose configuration
  # ──────────────────────────────────────────────────────────────────────────
  compose-validate:
    name: Compose — Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          echo "Validating docker-compose.yml ..."
          docker compose -f docker-compose.yml config --quiet
          echo "docker-compose.yml is valid."

      - name: Validate MLflow override (if present)
        run: |
          if [ -f "docker/docker-compose.mlflow.yml" ]; then
            echo "Validating docker/docker-compose.mlflow.yml ..."
            docker compose \
              -f docker-compose.yml \
              -f docker/docker-compose.mlflow.yml \
              config --quiet
            echo "MLflow override is valid."
          else
            echo "docker/docker-compose.mlflow.yml not found — skipping."
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Verify Dockerfiles exist
  # ──────────────────────────────────────────────────────────────────────────
  dockerfile-check:
    name: Compose — Dockerfile Existence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Dockerfile paths from compose file
        id: extract
        run: |
          # Pull all `build.dockerfile` and `build.context` entries
          python3 - <<'EOF'
          import yaml, os, sys

          with open("docker-compose.yml") as f:
              compose = yaml.safe_load(f)

          missing = []
          services = compose.get("services", {})
          for svc_name, svc in services.items():
              build = svc.get("build")
              if not build:
                  continue
              if isinstance(build, str):
                  context    = build
                  dockerfile = "Dockerfile"
              else:
                  context    = build.get("context", ".")
                  dockerfile = build.get("dockerfile", "Dockerfile")

              path = os.path.join(context, dockerfile)
              if os.path.exists(path):
                  print(f"  OK  {svc_name}: {path}")
              else:
                  print(f"  MISSING  {svc_name}: {path}")
                  missing.append(path)

          if missing:
              print(f"\n{len(missing)} Dockerfile(s) missing:")
              for m in missing:
                  print(f"  - {m}")
              sys.exit(1)
          else:
              print("\nAll Dockerfiles present.")
          EOF

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Build images (without push)
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [compose-validate, dockerfile-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images defined in docker-compose.yml
        run: |
          echo "Building all images (no push) ..."
          docker compose -f docker-compose.yml build \
            --no-cache \
            --progress=plain \
            2>&1 | tail -50
          echo "Build complete."
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
